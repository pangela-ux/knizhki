<style>
:root{
  --paper:#EFF0F6; --card:#FFFFFF; --ink:#1B1840; --muted:#5F5D7E; --line:#D8D9E6;
  --accent:#4A2FCF; --on-accent:#FFFFFF; --fav:#D92B48;
  --stamp-ink:#4A2FCF; --stamp-paper:#FBFAFF;
  --cover-shadow:0 1px 0 rgba(27,24,64,.10), 0 8px 14px -8px rgba(27,24,64,.45);
  --display:"Sofia Sans Extra Condensed","Arial Narrow","Sofia Sans",system-ui,sans-serif;
  --text:"Sofia Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131128; --card:#1D1A3A; --ink:#ECEBFA; --muted:#A5A3C6; --line:#302C58;
    --accent:#A99BFF; --on-accent:#17123F; --fav:#FF6B84;
    --cover-shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 14px -8px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131128; --card:#1D1A3A; --ink:#ECEBFA; --muted:#A5A3C6; --line:#302C58;
  --accent:#A99BFF; --on-accent:#17123F; --fav:#FF6B84;
  --cover-shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 14px -8px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4;padding-bottom:92px}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}

.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:22px;padding-bottom:14px}
.top h1{font-family:var(--display);font-weight:900;font-size:clamp(2.1rem,10vw,2.9rem);line-height:.95;letter-spacing:.005em;text-wrap:balance}
.top p{color:var(--muted);margin-top:6px;font-size:.95rem}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.sm{width:36px;height:36px;border-radius:10px;border-color:transparent;background:transparent}

.notice{margin:0 0 14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:.95rem}

/* Lists */
.list{margin-top:22px}
.list:first-child{margin-top:6px}
.list-head{display:flex;align-items:baseline;gap:10px;padding:0 2px 8px}
.list-head h2{font-family:var(--display);font-weight:900;font-size:1.7rem;line-height:1;flex:1;min-width:0}
.list-count{color:var(--muted);font-size:.9rem;white-space:nowrap}
.list-head .icon-btn{align-self:center}
.sub{font-size:.85rem;font-weight:600;color:var(--muted);margin:12px 2px 6px}
.rows{background:var(--card);border-radius:14px;overflow:hidden}
.rows.reserve{background:transparent;border:1.5px dashed var(--line)}
.row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 4px 10px 12px;border:0;background:none;text-align:left}
.thumb{flex:none;width:38px}
.thumb .cover{border-radius:2px 4px 4px 2px;box-shadow:none}
.row-text{min-width:0;display:grid;gap:1px}
.row-title{font-weight:600;line-height:1.25}
.row-meta{color:var(--muted);font-size:.86rem;line-height:1.3}
.row.is-read .row-title{color:var(--muted);font-weight:400}
.check{flex:none;width:56px;border:0;background:none;display:grid;place-items:center}
.check span{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);display:grid;place-items:center}
.check svg{width:18px;height:18px;opacity:0}
.check[aria-checked="true"] span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check[aria-checked="true"] svg{opacity:1}
.check:disabled{opacity:.5;cursor:default}
.row.just .check span{animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.6)}60%{transform:scale(1.15)}to{transform:scale(1)}}

/* Covers */
.cover{display:block;position:relative;width:100%;aspect-ratio:4/5;border-radius:3px 7px 7px 3px;overflow:hidden;container-type:inline-size;background:var(--line);box-shadow:var(--cover-shadow)}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.cover.gen{background:var(--cb);color:var(--cf)}
.cover.gen::before{content:"";position:absolute;background:var(--cs)}
.p0{--cb:#F2B632;--cs:#E59C1C;--cf:#1B1840}
.p1{--cb:#E4472E;--cs:#C7351F;--cf:#FFF3DC}
.p2{--cb:#2F8A5B;--cs:#22704A;--cf:#F6F2C8}
.p3{--cb:#8CCBEA;--cs:#6AB4DC;--cf:#1B1840}
.p4{--cb:#F4A6BA;--cs:#EC88A3;--cf:#4A0E2B}
.p5{--cb:#47296A;--cs:#5B3888;--cf:#F8D56B}
.s0::before{width:92%;aspect-ratio:1;border-radius:50%;right:-30%;bottom:-18%}
.s1::before{width:120%;aspect-ratio:2/1;border-radius:999px 999px 0 0;left:-10%;bottom:-6%}
.s2::before{left:0;right:0;bottom:0;height:36%;background:repeating-linear-gradient(135deg,var(--cs) 0 7%,transparent 7% 14%)}
.s3::before{width:74%;aspect-ratio:1;border-radius:100% 0 0 0;right:0;bottom:0}
.s4::before{left:0;right:0;bottom:0;height:52%;clip-path:polygon(0 100%,50% 0,100% 100%)}
.ct{position:absolute;z-index:1;left:8%;right:8%;top:8%;font-family:var(--display);font-weight:900;font-size:18px;line-height:.95;text-wrap:balance;overflow-wrap:anywhere}
.ca{display:block;margin-top:.5em;font-family:var(--text);font-weight:600;font-size:max(11px,.36em);line-height:1.15}
.stamp{position:absolute;z-index:2;right:5%;bottom:5%;display:grid;justify-items:center;padding:2.6cqw 4cqw 2.2cqw;background:var(--stamp-paper);color:var(--stamp-ink);border:max(1.5px,1.1cqw) solid currentColor;border-radius:1.6cqw;transform:rotate(-7deg);font-family:var(--display);line-height:1;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.stamp b{font-weight:900;font-size:max(10px,10.5cqw)}
.stamp i{font-style:normal;font-weight:700;font-size:max(9px,9cqw);margin-top:.9cqw}
.stamp.land{animation:land .24s cubic-bezier(.2,.9,.3,1.2)}
@keyframes land{from{transform:rotate(-7deg) scale(1.9);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
.heart{position:absolute;z-index:2;left:6%;bottom:6%;width:max(18px,17cqw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#fff;color:#D92B48;font-size:max(11px,10cqw);line-height:1}

/* Grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:18px 12px}
.tile{display:block;width:100%;border:0;background:none;padding:0;text-align:left}
.tile-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:8px;font-weight:600;font-size:.88rem;line-height:1.2}
.tile-sub{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}

.seg{display:inline-flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;margin:4px 0 18px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.age-head{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:1;margin:28px 0 14px}
.age-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}
.age-row .age-head{margin:0;flex:1;min-width:0}
.age-row{gap:8px}
.sort-ic{position:relative;flex:none;display:grid;place-items:center;width:36px;height:36px;border:1.5px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink)}
.sort-ic .ic{width:17px;height:17px}
.sort-ic select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.grid > li{display:flex}
.grid .tile{display:flex;flex-direction:column;width:100%;height:100%}
.grid .tile-title{min-height:2.4em;line-height:1.2}
.grid .tile-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.toolbar + .age-row,.toolbar + .hint + .age-row{margin-top:6px}
.recap-box{background:var(--paper);border-radius:14px;min-height:120px;display:grid;place-items:center;overflow:hidden}
.recap-box img{display:block;width:100%;height:auto}
.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:var(--card);border-radius:14px;padding:14px 16px;margin-top:0}
.stats dt{color:var(--muted);white-space:nowrap}
.stats dd{font-weight:600;text-align:right}
.hint{margin-top:16px;padding:14px 16px;border:1.5px dashed var(--line);border-radius:14px;display:grid;gap:10px;justify-items:start}
.empty{padding:40px 8px;color:var(--muted);max-width:34ch}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border:1.5px solid var(--ink);border-radius:12px;background:transparent;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{border-color:var(--line)}
.btn.danger{border-color:var(--line);color:var(--fav)}
.btn.block{width:100%}
.btn[aria-pressed="true"]{background:var(--fav);border-color:var(--fav);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.field{display:grid;gap:6px;font-size:.9rem;font-weight:600}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-weight:400;font-size:1rem}
.field textarea{min-height:92px;resize:vertical;line-height:1.4}
.field input.bad{border-color:var(--fav)}
.checkline{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;font-size:.95rem}
.checkline input{width:22px;height:22px;accent-color:var(--accent)}
.stack{display:grid;gap:14px}
.rowbtns{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.rowbtns .btn{flex:1 1 140px}
.rowbtns:empty{display:none}
.small{font-size:.88rem;color:var(--muted)}
a.btn{text-decoration:none;color:inherit}
.btn.slim{min-height:38px;padding:6px 14px;margin-top:10px;font-size:.92rem}
.loan{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:12px;margin-bottom:12px}
.loan.soon,.loan.late{border-color:var(--fav)}
.loan-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 4px 10px}
.loan-head strong{font-size:1.05rem}
.loan-head span{color:var(--muted);font-size:.9rem;white-space:nowrap}
.loan.soon .loan-head span,.loan.late .loan-head span{color:var(--fav);font-weight:600}
.loan .rows{background:var(--paper);margin-bottom:12px}
.picks{display:grid;gap:2px}
.zone{font-family:var(--display);font-weight:900;font-size:1.35rem;line-height:1;margin:18px 2px 10px;color:var(--accent)}
.sec + .zone{margin-top:4px}
.sec{font-size:.95rem;font-weight:600;color:var(--muted);margin:26px 2px 10px}
.fold{margin-bottom:10px}
.fold-head{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:16px;background:var(--card);text-align:left}
.fold-covers{flex:none;display:flex;padding-left:10px}
.fold-covers .cover{flex:none;width:30px;margin-left:-10px;border-radius:2px 4px 4px 2px;box-shadow:0 0 0 2px var(--card)}
.fold-text{flex:1;min-width:0;display:grid;gap:1px}
.fold-name{font-family:var(--display);font-weight:900;font-size:1.45rem;line-height:1.05}
.fold-sub{color:var(--muted);font-size:.86rem}
.chev{flex:none;width:22px;height:22px;color:var(--muted);transition:transform .15s}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fold-body{padding:10px 0 8px}
.fold-body .rowbtns{margin-top:10px}
.past-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;margin:22px 0 10px;padding:12px 4px 4px;border:0;border-top:1px solid var(--line);background:none;color:var(--muted);font-weight:600}
.loan-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 4px 0}
.loan-top h2{font-family:var(--display);font-weight:900;font-size:1.8rem;line-height:1}
.loan-left{font-size:.9rem;font-weight:600;white-space:nowrap;color:var(--accent)}
.loan.soon .loan-left,.loan.late .loan-left{color:var(--fav)}
.loan-sub{color:var(--muted);font-size:.9rem;padding:4px 4px 10px}
.bar{height:6px;border-radius:3px;background:var(--line);margin:0 4px 12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.loan.soon .bar i,.loan.late .bar i{background:var(--fav)}
.loan.next{border-color:var(--line)}
.loan .sub{margin-top:0}
.nowrap{white-space:nowrap}
.photo-row{flex-wrap:nowrap}
.photo-row .btn{flex:1 1 0;min-width:0;padding:8px 8px;font-size:.9rem;gap:6px}
.rowbtns .btn.icon-only{flex:0 0 46px;padding:0;color:var(--fav);border-color:var(--fav)}
.lib-badge{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--paper);color:var(--accent);font-family:var(--display);font-weight:900;font-size:1.15rem;overflow:hidden;vertical-align:middle}
.lib-badge img{width:100%;height:100%;object-fit:contain;background:#fff}
.lib-badge.sm{width:22px;height:22px;border-radius:6px;font-size:.7rem;margin-right:6px}
.lib-badge.lg{width:72px;height:72px;border-radius:16px;font-size:1.9rem}
.lib-top{display:flex;align-items:center;gap:14px}
.hours{white-space:pre-line}
.days{display:flex;flex-wrap:wrap;gap:4px 14px}
.days label{display:flex;align-items:center;gap:6px;min-height:36px;font-weight:600;font-size:.92rem}
.days input{width:20px;height:20px;accent-color:var(--accent)}
.ic.flip{transform:rotate(180deg);color:var(--muted);margin-left:auto}
.pick .row-text{flex:1}
.cond-img{display:block;width:100%;max-width:220px;margin-top:8px;border-radius:8px}
.preview.returned{font-weight:600;color:var(--accent)}
.erow{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.erow.ask .erow-t{flex:1 1 100%}
.erow:first-child{border-top:0}
.erow-t{flex:1 1 130px;min-width:0;font-weight:600;line-height:1.25}
.ic{flex:none;width:19px;height:19px}
.btn.mini .ic{width:15px;height:15px}
.btn.mini{gap:5px;min-height:36px;padding:4px 10px;font-size:.86rem;border-radius:10px;border-color:var(--line)}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:9px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.pick .thumb{width:34px}
.pick-h{font-size:.85rem;font-weight:600;color:var(--muted);margin:14px 0 4px}
.stars{display:flex;gap:4px}
.stars button{width:46px;height:46px;border:0;background:none;padding:0;font-size:2rem;line-height:1;color:var(--line)}
.stars button.on{color:#F2B632}
.marks{position:absolute;z-index:3;left:6%;bottom:6%;display:flex;flex-direction:column-reverse;gap:max(3px,3cqw)}
.marks .heart{position:static}
.heart.again{color:#4A2FCF}
.heart.again svg{width:64%;height:64%}
.tile-stars{display:block;margin-top:3px;font-size:.8rem;letter-spacing:.06em;line-height:1;color:#E0A21A}
.tile-stars i{font-style:normal;color:var(--line)}
.add-cover{display:flex;align-items:center;gap:12px}
.add-cover img{width:54px;aspect-ratio:4/5;object-fit:cover;border-radius:3px 6px 6px 3px;box-shadow:var(--cover-shadow)}
.st-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st-tile{position:relative;overflow:hidden;display:grid;align-content:space-between;min-height:104px;padding:12px 12px 11px;border-radius:6px 16px 16px 6px;background:var(--cb);color:var(--cf)}
.st-tile svg{position:absolute;right:10px;top:10px;width:40px;height:40px;opacity:.26}
.st-tile b{position:relative;font-family:var(--display);font-weight:900;font-size:3.1rem;line-height:.85}
.st-tile span{position:relative;font-weight:600;font-size:.86rem;line-height:1.15}
.st-card{background:var(--card);border-radius:16px;margin-top:10px;overflow:hidden}
.st-heads{display:grid;grid-template-columns:1fr 1fr}
.st-head{display:flex;align-items:center;gap:6px;min-width:0;min-height:62px;padding:10px 10px 10px 14px;border:0;border-left:1px solid var(--line);background:none;text-align:left}
.st-head:first-child{border-left:0}
.st-head[aria-expanded="true"]{background:var(--paper)}
.st-htext{flex:1;min-width:0;display:grid;gap:2px}
.st-title{font-size:.76rem;font-weight:600;color:var(--muted);line-height:1.15}
.st-peek{font-weight:600;font-size:.95rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-head .chev{width:20px;height:20px}
.st-body{padding:6px 16px 10px;border-top:1px solid var(--line)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 18px}
.toolbar .seg{margin:0}
.sortbox{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;color:var(--muted)}
.sortbox select{min-height:40px;padding:6px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;font-size:.9rem;color:var(--ink)}
.st-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:6px 0}
.st-name{font-weight:600;line-height:1.2}
.st-n{color:var(--muted);font-size:.86rem;white-space:nowrap}
.st-bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--paper);overflow:hidden;margin-top:4px}
.st-bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.idle{position:relative;overflow:hidden;margin:0 0 14px;padding:16px 16px 14px;border-radius:6px 18px 18px 6px;background:#47296A;color:#F8D56B}
.idle::before{content:"";position:absolute;width:150px;aspect-ratio:1;border-radius:50%;right:-50px;top:-60px;background:#5B3888}
.idle p{position:relative;font-family:var(--display);font-weight:900;font-size:1.65rem;line-height:1.05;text-wrap:balance;margin-bottom:12px}
.idle-btns{position:relative;display:flex;flex-wrap:wrap;gap:8px}
.idle .btn{min-height:40px;padding:6px 14px;border-color:#F8D56B;color:#F8D56B;font-size:.92rem}
.idle .btn.quiet{border-color:rgba(248,213,107,.35)}
.due-banner{display:block;width:100%;margin:0 0 14px;padding:13px 16px;border:0;border-radius:14px;background:var(--fav);color:#fff;font-weight:600;text-align:left;line-height:1.3}

/* Tabs and add button */
.tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:none;padding:9px 4px 10px;display:grid;justify-items:center;gap:3px;color:var(--muted);font-size:.8rem;font-weight:600;border-top:3px solid transparent;margin-top:-1px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.tabs button.tab-add{flex:0 0 104px;color:var(--ink);border-top-color:transparent;padding-top:0}
.tabs button.tab-add svg{width:60px;height:60px;margin-top:-24px;padding:15px;border-radius:22px;background:var(--accent);color:var(--on-accent);border:4px solid var(--card);box-shadow:0 8px 16px -8px rgba(27,24,64,.55)}

/* Sheet */
.sheet-wrap{position:fixed;z-index:40;inset:0;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(15,12,40,.55)}
.sheet{position:relative;width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out}
.sheet:focus{outline:none}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-bar{display:flex;justify-content:flex-end;margin-bottom:4px}
.sheet h2.sheet-title{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:1;margin-bottom:16px}
.bk{display:grid;grid-template-columns:42% 1fr;gap:16px;align-items:start;margin-bottom:18px}
.bk-title{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:.98;overflow-wrap:anywhere}
.bk-meta{color:var(--muted);margin-top:6px}
.bk-read{margin-top:12px;font-weight:600;color:var(--accent)}
details.edit{border-top:1px solid var(--line);padding-top:12px}
details.edit summary{font-weight:600;min-height:36px;cursor:pointer}
details.edit .stack{margin-top:10px}
.preview{padding:10px 12px;border-radius:12px;background:var(--paper);font-size:.92rem}

.toast{position:fixed;z-index:60;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(90vw,420px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:600;font-size:.92rem;text-align:center;pointer-events:none;opacity:0;transition:opacity .18s}
.toast.on{opacity:1}

@media (prefers-reduced-motion: reduce){
  .sheet,.stamp.land,.row.just .check span{animation:none}
  .toast{transition:none}
}

/* ---------- Look taken from the Marmot catalogue: navy band, cream page, white cards, pills ---------- */
:root{
  --paper:#F7F3EB; --card:#FFFFFF; --ink:#2B2547; --muted:#6E6A88; --line:#E9E4DB;
  --navy:#3D3660; --navy2:#4A4474; --hi:#FBAF10; --on-hi:#2B2547; --well:#F6F5FA; --lav:#F2EBFB; --violet:#6954D9;
  --accent:#3D3660; --on-accent:#FFFFFF; --fav:#D4506A; --fav-soft:#FBE4E8;
  --stamp-ink:#6954D9; --stamp-paper:#FFFFFF;
  --card-shadow:0 12px 24px -18px rgba(61,54,96,.55), 0 1px 0 rgba(61,54,96,.05);
  --cover-shadow:0 6px 12px -8px rgba(43,37,71,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1D1931; --card:#2A2548; --ink:#F4F1FB; --muted:#B5B0CF; --line:#3C3662;
    --navy:#15122A; --navy2:#241F40; --well:#342E57; --lav:#35305A; --violet:#B9ADFF;
    --accent:#B9ADFF; --on-accent:#1D1931; --fav:#FF8296; --fav-soft:#4A2A3A;
    --card-shadow:0 12px 24px -18px rgba(0,0,0,.9);
    --cover-shadow:0 6px 12px -8px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#1D1931; --card:#2A2548; --ink:#F4F1FB; --muted:#B5B0CF; --line:#3C3662;
  --navy:#15122A; --navy2:#241F40; --well:#342E57; --lav:#35305A; --violet:#B9ADFF;
  --accent:#B9ADFF; --on-accent:#1D1931; --fav:#FF8296; --fav-soft:#4A2A3A;
  --card-shadow:0 12px 24px -18px rgba(0,0,0,.9);
  --cover-shadow:0 6px 12px -8px rgba(0,0,0,.8);
}
html{background:var(--navy)}
:focus-visible{outline-color:var(--hi)}

.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:0 0 28px 28px}
.hero::before,.hero::after{content:"";position:absolute;background:var(--navy2);pointer-events:none}
.hero::before{width:210px;height:150px;right:-70px;top:-50px;border-radius:46% 54% 60% 40% / 55% 45% 55% 45%;transform:rotate(-18deg)}
.hero::after{width:120px;height:160px;left:-60px;bottom:-90px;border-radius:60% 40% 45% 55% / 50% 60% 40% 50%;transform:rotate(24deg)}
.hero .top{position:relative;z-index:1;padding-top:20px;padding-bottom:24px}
.hero h1{color:#fff}
.hero p{color:#CFCBE6}
.top-btns{display:flex;gap:8px;flex:none}
.hero .icon-btn{border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff}
.page{padding-top:16px}

.notice{border:0;border-radius:16px;box-shadow:var(--card-shadow)}
.due-banner{border-radius:18px;background:var(--fav)}
.idle{border-radius:22px;background:var(--navy);color:var(--hi)}
.idle::before{background:var(--navy2)}
.idle .btn{border-color:var(--hi);color:var(--hi);background:transparent}
.idle .btn.quiet{border-color:rgba(251,175,16,.4);background:transparent}

/* cards */
.rows{border-radius:18px;box-shadow:var(--card-shadow)}
.rows.reserve{box-shadow:none;border-radius:18px}
.row{border-top-color:var(--line)}
.fold-head{border-radius:18px;box-shadow:var(--card-shadow)}
.fold-covers .cover{box-shadow:0 0 0 2px var(--card)}
.loan{border:0;border-radius:22px;padding:14px;box-shadow:var(--card-shadow)}
.loan.soon,.loan.late{box-shadow:var(--card-shadow), inset 0 0 0 2px var(--fav)}
.loan.next{border:0}
.loan .rows{background:var(--well);box-shadow:none;border-radius:16px}
.loan .rows.reserve{background:transparent}
.loan-left{padding:4px 10px;border-radius:999px;background:var(--lav);color:var(--violet);font-size:.84rem}
.loan.soon .loan-left,.loan.late .loan-left{background:var(--fav-soft);color:var(--fav)}
.bar{height:8px;border-radius:4px;background:var(--well)}
.bar i{border-radius:4px;background:linear-gradient(90deg,#DE8B96,#61AE98 40%,#BB8CDD 72%,#FFC233)}
.loan.soon .bar i,.loan.late .bar i{background:var(--fav)}
.st-card{box-shadow:var(--card-shadow);border-radius:18px}
.st-tile{border-radius:18px}
.stats,.hint,.preview{border-radius:16px}
.preview{background:var(--well)}
.zone{color:var(--violet)}
.sec{color:var(--muted)}

/* round check like the catalogue's plus button */
.check span{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--muted);color:var(--muted)}
.check svg{opacity:.45}
.check[aria-checked="true"] span{background:var(--accent);color:var(--on-accent);box-shadow:none}
.check[aria-checked="true"] svg{opacity:1}

/* pills */
.btn{border-radius:999px;border-color:var(--ink);background:var(--card)}
.btn.primary{background:var(--hi);border-color:var(--hi);color:var(--on-hi)}
.btn.quiet{border-color:var(--line);background:var(--card)}
.btn.danger{border-color:var(--line);color:var(--fav)}
.btn.mini{border-radius:999px;background:var(--card)}
.rowbtns .btn.icon-only{border-radius:50%}
.seg{background:none;padding:0;gap:8px;border-radius:0}
.seg button{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sortbox select{border-radius:999px;background:var(--card);padding:6px 14px}
.field input,.field select,.field textarea{background:var(--well);border-color:transparent;border-radius:14px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet);outline:none}
.checkline input,.days input{accent-color:var(--violet)}
.stars button.on{color:var(--hi)}
.tile-stars{color:#E79A00}

/* collection tiles as catalogue cards: white card, pale well, cover inside, sticker on the corner */
.grid{gap:14px 10px}
.tile{position:relative;background:var(--card);border-radius:16px;padding:7px 7px 10px;box-shadow:var(--card-shadow)}
.tile .well{display:block;background:none;padding:0}
.tile .cover{border-radius:4px 10px 10px 4px}
.tile-title{margin-top:8px;padding:0 2px;font-size:.84rem}
.tile-sub{padding:0 2px}
.sticker{position:absolute;z-index:3;top:-7px;right:-5px;min-width:30px;padding:3px 7px 4px;border-radius:9px 9px 9px 3px;border:2px solid #fff;background:#FFC233;color:#2B2547;font-family:var(--display);font-weight:900;font-size:.95rem;line-height:1;text-align:center;transform:rotate(9deg);box-shadow:0 4px 8px -4px rgba(43,37,71,.5)}
.sticker.r4{background:#61AE98}
.sticker.r3{background:#BB8CDD}
.sticker.r2,.sticker.r1{background:#DE8B96}

/* cover palette from the age stickers */
.p0{--cb:#FFC233;--cs:#F6AE12;--cf:#2B2547}
.p1{--cb:#DE8B96;--cs:#CF7381;--cf:#2B2547}
.p2{--cb:#61AE98;--cs:#4E9A85;--cf:#2B2547}
.p3{--cb:#BB8CDD;--cs:#A674CC;--cf:#2B2547}
.p4{--cb:#F9BEC2;--cs:#F2A4AB;--cf:#2B2547}
.p5{--cb:#3D3660;--cs:#4E477A;--cf:#FFC233}
.heart{color:#D4506A}
.heart.again{color:#6954D9}

/* tab bar */
.tabs{border-top:0;box-shadow:0 -10px 24px -18px rgba(61,54,96,.6);border-radius:22px 22px 0 0}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:transparent}
.tabs button[aria-current="page"] svg{color:var(--hi)}
.tabs button.tab-add svg{background:var(--hi);color:#2B2547;border-radius:50%;border-color:var(--card)}

/* sheets */
.sheet{border-radius:26px 26px 0 0}
.toast{background:var(--navy);color:#fff;border-radius:999px}
.past-toggle{border-top-color:var(--line)}
.erow{border-top-color:var(--line)}
.pick{border-top-color:var(--line)}
.lib-badge{background:var(--lav);color:var(--violet)}

/* age zones that fold */
.zone-head{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0;padding:12px 14px 12px 16px;border:0;border-radius:18px;background:var(--lav);color:var(--ink);text-align:left}
.zone-head .zone-name{font-family:var(--display);font-weight:900;font-size:1.35rem;line-height:1;color:var(--violet)}
.zone-head .zone-sub{flex:1;min-width:0;color:var(--muted);font-size:.86rem}
.zone-body{padding-left:0;margin-bottom:6px}
details.lib-sec{border-top:1px solid var(--line);padding-top:12px}
details.lib-sec summary{font-weight:600;min-height:36px;cursor:pointer}
details.lib-sec .stack{margin-top:10px}
.sr-empty{padding:18px 4px;color:var(--muted)}
</style>
</head>

<script>
/* Standalone storage: everything lives on this device (IndexedDB). Same small API the page uses inside Claude. */
(function(){
  'use strict';
  var mem = {}, urls = {}, subs = [], idb = null, n = 0;
  function clone(v){ return v == null ? v : JSON.parse(JSON.stringify(v)); }
  function tx(store, mode){ return idb.transaction(store, mode).objectStore(store); }
  function done(req){ return new Promise(function(res, rej){ req.onsuccess = function(){ res(req.result); }; req.onerror = function(){ rej(req.error); }; }); }
  function persist(path){ try { if (path in mem) tx('docs', 'readwrite').put(mem[path], path); else tx('docs', 'readwrite').delete(path); } catch (e) { if (window.console) console.error(e); } }
  function fire(){ subs.slice().forEach(function(f){ try { f(); } catch (e) { if (window.console) console.error(e); } }); }
  function snap(path){ var v = mem[path]; return { id: path.split('/').pop(), exists: v !== undefined, data: function(){ return clone(v); }, metadata: {} }; }
  function genId(){ n++; return 'x' + Date.now().toString(36) + n.toString(36) + Math.random().toString(36).slice(2, 6); }
  function docRef(path){
    return {
      id: path.split('/').pop(), path: path,
      get: function(){ return Promise.resolve(snap(path)); },
      set: function(d){ mem[path] = clone(d); persist(path); fire(); return Promise.resolve(); },
      update: function(d){
        if (mem[path] === undefined) return Promise.reject({ code: 'invalid_argument', message: 'no such document' });
        mem[path] = Object.assign({}, mem[path], clone(d)); persist(path); fire(); return Promise.resolve();
      },
      delete: function(){ delete mem[path]; persist(path); fire(); return Promise.resolve(); },
      onSnapshot: function(next){ var f = function(){ next(snap(path)); }; subs.push(f); setTimeout(f, 0); return function(){ subs = subs.filter(function(x){ return x !== f; }); }; },
      collection: function(sub){ return colRef(path + '/' + sub); }
    };
  }
  function colRef(col){
    var depth = col.split('/').length + 1;
    return {
      path: col,
      doc: function(id){ return docRef(col + '/' + (id || genId())); },
      add: function(d){ var r = docRef(col + '/' + genId()); return r.set(d).then(function(){ return r; }); },
      onSnapshot: function(next){
        var f = function(){
          var docs = Object.keys(mem).filter(function(k){ return k.indexOf(col + '/') === 0 && k.split('/').length === depth; }).sort().map(snap);
          next({ docs: docs, size: docs.length, empty: !docs.length, metadata: {} });
        };
        subs.push(f); setTimeout(f, 0);
        return function(){ subs = subs.filter(function(x){ return x !== f; }); };
      }
    };
  }
  function putBlob(id, blob){
    if (urls[id]) URL.revokeObjectURL(urls[id]);
    urls[id] = URL.createObjectURL(blob);
    return done(tx('blobs', 'readwrite').put(blob, id)).then(function(){ return id; });
  }
  var api = {
    db: { doc: docRef, collection: colRef },
    user: { can: function(){ return Promise.resolve(true); }, isOwner: function(){ return Promise.resolve(true); } },
    assets: {
      upload: function(blob){ var id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); return putBlob(id, blob).then(function(){ return { id: id, url: urls[id], sizeBytes: blob.size, contentType: blob.type }; }); },
      delete: function(id){ if (urls[id]){ URL.revokeObjectURL(urls[id]); delete urls[id]; } return done(tx('blobs', 'readwrite').delete(id)).then(function(){ return { deleted: true }; }); }
    },
    downloads: {
      save: function(o){
        var types = { csv: 'text/csv', json: 'application/json', zip: 'application/zip', jpg: 'image/jpeg', png: 'image/png' };

function chronHTML(read, favOnly){
  var html = '', birth = S.settings.birth, groups = [], idx = {};

  }
  var entries = [];
  read.forEach(function(b){ readingsOf(b).forEach(function(v){ entries.push(v); }); });
  if (favOnly) entries = entries.filter(isFav);
  entries.sort(function(a, b){ return (b.readAt || '').localeCompare(a.readAt || ''); });
  entries.forEach(function(b){
    var a = birth ? ageAt(birth, b.readAt) : null, key, head, sub;

    else { key = 'y' + (b.readAt || '').slice(0, 4); head = (b.readAt || '').slice(0, 4) || 'Без дата'; sub = fmt(b.readAt); }
    if (favOnly) key = 'f' + key;
    if (!idx[key]){ idx[key] = { key: key, head: head, items: [] }; if (favOnly) idx[key].title = 'Любими'; groups.push(idx[key]); }
    idx[key].items.push({ b: b, sub: sub });
  });
  var cmp = sortCmp();
  if (S.sort === 'old') groups.reverse();
  groups.forEach(function(g){
    g.items.sort(function(a, b){ return (b.b.again ? 1 : 0) - (a.b.again ? 1 : 0) || cmp(a.b, b.b); });
    if (favOnly) g.line = plural(g.items.length, 'любима книга', 'любими книги') + ' с пет звезди';
    RECAP[g.key] = g;
    html += '<div class="age-row"><h2 class="age-head">' + esc(g.head) + '</h2><button class="btn mini" data-act="recap" data-id="' + esc(g.key) + '">' + ic('image') + 'Равносметка</button>' + sortIcon() + '</div><ul class="grid">' + g.items.map(function(x){ return tileHTML(x.b, x.b.publisher || x.b.author || ''); }).join('') + '</ul>';
  });
  return html;
}

function renderSheet(force){
  if (!S.sheet) return;
  if (!force){
    var a = document.activeElement;
    if (a && sheetBody.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if (S.sheet.kind !== 'book') return; /* forms keep what is typed */
  }
  var k = S.sheet.kind, html = k === 'book' ? sheetBook(S.sheet.id) : k === 'add' ? sheetAdd() : k === 'list' ? sheetList(S.sheet.id) : k === 'pick' ? sheetPick() : k === 'extend' ? sheetExtend(S.sheet.id) : k === 'lib' ? sheetLib(S.sheet.id) : k === 'recap' ? sheetRecap(S.sheet.id) : k === 'search' ? sheetSearch() : k === 'borrow' ? sheetBorrow(S.sheet.id) : sheetSettings();
  if (html == null){ closeSheet(); return; }
  var openState = {}, had = false;
  sheetBody.querySelectorAll('details').forEach(function(d, n){ openState[d.getAttribute('data-k') || 'n' + n] = d.open; had = true; });
  sheetBody.innerHTML = html;
  sheetBody.querySelectorAll('details').forEach(function(d, n){ var key = d.getAttribute('data-k') || 'n' + n; if (had && key in openState) d.open = openState[key]; });
  if (S.confirm === 'del-book' || S.confirm === 'del-list'){ var dd = sheetBody.querySelector('details.edit'); if (dd) dd.open = true; }
  if (k === 'search'){ var sq = $('#sq'); if (sq) sq.focus(); }
  if (k === 'lib') fillLetter(true);
}
function openSheet(kind, id){
  S.lastFocus = document.activeElement;
  S.sheet = { kind: kind, id: id }; S.confirm = null;
  sheetBody.innerHTML = '';
  renderSheet(true);
  if (kind === 'book' && S.books.get(id)) prepareShare(S.books.get(id));
  sheetWrap.hidden = false; document.body.classList.add('locked');
  sheetEl.scrollTop = 0; sheetEl.setAttribute('aria-labelledby', 'sheetTitle'); sheetEl.focus();
}
function closeSheet(){
  var a = document.activeElement;
  if (a && sheetBody.contains(a) && a.blur) a.blur(); /* commits a note being typed */
  S.sheet = null; S.confirm = null;
  sheetWrap.hidden = true; document.body.classList.remove('locked');
  if (S.lastFocus && S.lastFocus.isConnected && S.lastFocus.focus) S.lastFocus.focus();
}

    case 'lib-logo-remove':
      var oldLogo = (libs().filter(function(l){ return l.id === id; })[0] || {}).logo;
      saveLibs(libs().map(function(l){ if (l.id !== id) return l; var c2 = Object.assign({}, l); delete c2.logo; return c2; })).then(function(){ if (oldLogo && S.assets) S.assets.delete(oldLogo).catch(function(){}); renderSheet(true); }, saveFail);
      break;
    case 'lib-back': S.sheet = { kind: 'settings' }; S.confirm = null; sheetBody.innerHTML = ''; renderSheet(true); break;
    case 'lib-del': S.confirm = 'del-lib'; renderSheet(true); break;
    case 'lib-del-yes':
      saveLibs(libs().filter(function(l){ return l.id !== id; })).then(function(){ S.sheet = { kind: 'settings' }; S.confirm = null; sheetBody.innerHTML = ''; renderSheet(true); toast('Библиотеката е изтрита.'); }, saveFail);
      break;
    case 'lib-save':
      var lbName = $('#lbName').value.trim();
      if (!lbName){ toast('Напиши име на библиотеката.'); break; }
      var lbDays = parseInt($('#lbDays').value, 10);
      var rec = { id: id === '__new' ? 'lib' + Date.now().toString(36) : id, name: lbName, phone: $('#lbPhone').value.trim(), mail: $('#lbMail').value.trim(),
        cardNo: $('#lbCardNo').value.trim(), cardUntil: $('#lbCardUntil').value || null, loanDays: lbDays > 0 ? lbDays : 20, lastThu: $('#lbThu').checked,
        hours: $('#lbHours').value.trim(), closed: Array.prototype.map.call(sheetBody.querySelectorAll('input[data-day]:checked'), function(c){ return parseInt(c.getAttribute('data-day'), 10); }) };
      var arr = libs().map(function(l){ if (l.id === rec.id){ if (l.logo) rec.logo = l.logo; return rec; } return l; });
      if (id === '__new') arr.push(rec);
      setBusy(true);
      saveLibs(arr).then(function(){ setBusy(false); S.sheet = { kind: 'settings' }; sheetBody.innerHTML = ''; renderSheet(true); toast('„' + lbName + '“ е запазена.'); }, function(e){ setBusy(false); saveFail(e); });
      break;
    case 'copy-letter':
      var lbox = $('#letterBox'), grp = S.sheet && S.sheet.kind === 'extend' ? loanGroup(S.sheet.id) : [];
      var letter = lbox ? lbox.value : letterText(grp.length ? libOf(grp[0]) : libs()[0], grp), copied = function(){ toast('Писмото е копирано.'); };
      var manual = function(){
        var box = $('#letterBox'), temp = null;
        if (!box){ temp = document.createElement('textarea'); temp.value = letter; temp.setAttribute('readonly', ''); temp.style.cssText = 'position:fixed;left:0;top:0;opacity:0'; sheetBody.appendChild(temp); box = temp; }
        box.focus(); box.select();
        var ok = false; try { ok = document.execCommand('copy'); } catch (err) {}
        if (temp) temp.remove();
        if (ok) copied(); else toast(temp ? 'Копирането не тръгна. Писмото е в Настройки → Рядко ползвани.' : 'Писмото е маркирано. Копирай го от менюто на телефона.');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(letter).then(copied, manual); else manual();
      break;
    case 'idle-preview': S.idlePreview = true; S.idleHidden = false; closeSheet(); renderAll(); window.scrollTo(0, 0); break;
    case 'add-mode': S.addMode = t.getAttribute('data-v'); renderSheet(true); break;
    case 'li-rm-ask': S.confirm = 'rm:' + t.getAttribute('data-b'); renderSheet(true); break;
    case 'li-wish':
      var wb = S.books.get(t.getAttribute('data-b'));
      S.confirm = null;
      markWish(t.getAttribute('data-b')).then(function(){ renderSheet(true); toast('„' + (wb ? wb.title : '') + '“ отиде в „За купуване“.'); });
      break;
    case 'li-add-res': S.sheet = { kind: 'pick', id: id, mode: 'add', res: true, book: null, q: '' }; renderSheet(true); sheetEl.scrollTop = 0; break;
    case 'wish-mark': if (b) markWish(id).then(function(){ renderSheet(true); toast('Отиде в „За купуване“.'); }); break;
    case 'wish-bought': if (b) upd('books', id, { wish: false, lib: false }).then(function(ok){ if (ok) toast('Вече е в „Наши книги“.'); renderSheet(true); }); break;
    case 'wish-lib': if (b) upd('books', id, { wish: false, lib: true }).then(function(ok){ if (ok) toast('Върната е при библиотечните.'); renderSheet(true); }); break;
    case 'li-remove':
      S.confirm = null;
      var Lr = listById(id);
      if (Lr) setItems(id, cloneItems(Lr).filter(function(it){ return it.b !== t.getAttribute('data-b'); })).then(function(){ renderSheet(true); });
      break;
    case 'li-promote':
      promoteInList(id, t.getAttribute('data-b')).then(function(){ renderSheet(true); });
      break;
    case 'li-swap': S.sheet = { kind: 'pick', id: id, mode: 'swap', book: t.getAttribute('data-b'), q: '' }; renderSheet(true); sheetEl.scrollTop = 0; break;
    case 'li-add': S.sheet = { kind: 'pick', id: id, mode: 'add', book: null, q: '' }; renderSheet(true); sheetEl.scrollTop = 0; break;
    case 'pick-back': S.sheet = { kind: 'list', id: id }; renderSheet(true); break;
    case 'pick-new': S.addMode = 'one'; S.sheet = { kind: 'add', list: id }; renderSheet(true); sheetEl.scrollTop = 0; break;
    case 'pick':
      var sh = S.sheet, pb = t.getAttribute('data-b'), pBook = S.books.get(pb), back = function(){ S.sheet = { kind: 'list', id: sh.id }; renderSheet(true); };
      if (sh.mode === 'swap'){
        var aBook = S.books.get(sh.book);
        swapInList(sh.id, sh.book, pb).then(function(){ back(); toast('„' + (aBook ? aBook.title : '') + '“ е сменена с „' + (pBook ? pBook.title : '') + '“.'); });
      } else {
        moveIntoList(sh.id, pb, sh.res).then(function(asRes){ back(); toast('„' + (pBook ? pBook.title : '') + '“ е добавена' + (asRes ? ' като резерва.' : '.')); });
      }
      break;
    case 'add-one': addOne(); break;
    case 'add-bulk': addBulk(); break;
    case 'save-list':
      var nm = $('#lName').value.trim();
      upd('lists', id, { name: nm, age: $('#lAge').value.trim() }).then(function(ok){ if (ok){ closeSheet(); toast('Запазено.'); } });
      break;
    case 'delete-list': S.confirm = 'del-list'; renderSheet(true); break;
    case 'delete-list-yes':
      closeSheet();
      queue('lists/' + id, function(){ return S.db.collection('lists').doc(id).delete(); }).then(function(){ toast('Списъкът е изтрит.'); }, saveFail);
      break;
    case 'save-settings':
      var num = function(sel, def){ var v = parseInt($(sel).value, 10); return v > 0 ? v : def; };
      var data = Object.assign({}, S.settings, { child: $('#sChild').value.trim(), birth: $('#sBirth').value || null, remindDays: num('#sRemind', 7), maxPer: num('#sMax', 5), idleDays: num('#sIdle', 60) });
      queue('meta/settings', function(){ return S.db.doc('meta/settings').set(data); })
        .then(function(){ closeSheet(); toast('Настройките са запазени.'); }, saveFail);
      break;
  }
}
sheetWrap.addEventListener('click', onSheetClick);
sheetBody.addEventListener('change', function(e){
  var t = e.target, f = t.getAttribute && t.getAttribute('data-f');
  if (t.id === 'aList'){ $('#aNewWrap').hidden = t.value !== '__new'; $('#aResWrap').hidden = !t.value || t.value.indexOf('__') === 0; return; }
  if (t.id === 'aLib' || t.id === 'aRead'){ $('#aLibWrap').hidden = !$('#aLib').checked || $('#aRead').checked; $('#aWishWrap').hidden = $('#aLib').checked || $('#aRead').checked; return; }
  if (t.id === 'bLib'){ bulkPreview(); var bw = $('#bLibIdWrap'); if (bw) bw.hidden = !t.checked; return; }
  if (t.id === 'aLibId'){ rememberLib(t.value); return; }
  if (t.id === 'aAge'){ $('#aAgeNewWrap').hidden = t.value !== '__new'; return; }
  if (t.id === 'bAge'){ $('#bAgeNewWrap').hidden = t.value !== '__new'; return; }
  if (t.id === 'brLib'){ $('#brDue').textContent = borrowPreview($('#brDate').value || today(), t.value); $('#brHours').innerHTML = hoursHTML(libById(t.value)); return; }
  if (t.id === 'ltLib'){ fillLetter(true); return; }
  if (t.getAttribute && t.getAttribute('data-lt')){ fillLetter(false); return; }
  if (t.id === 'cBook'){ var cbk = S.books.get(t.value); $('#cText').value = cbk && cbk.cond ? cbk.cond : ''; return; }
  if (!f || !S.sheet || S.sheet.kind !== 'book') return;
  var id = S.sheet.id, b = S.books.get(id); if (!b) return;
  if (f === 'note'){ if (t.value !== (b.note || '')) upd('books', id, { note: t.value }); }
  if (f === 'lib'){
    var libOn = t.checked;
    upd('books', id, { lib: libOn }).then(function(){
      if (!libOn) upcomingInfos().forEach(function(i){ if (i.items.some(function(it){ return it.b === id; })) setItems(i.l.id, cloneItems(i.l).filter(function(it){ return it.b !== id; })); });
      renderSheet(true);
    });
  }
  if (f === 'again'){ upd('books', id, { again: t.checked }).then(function(){ renderSheet(true); }); }
  if (f === 'libId'){ rememberLib(t.value); upd('books', id, { libId: t.value }).then(function(){ renderSheet(true); }); }
  if (f === 'returnedAt'){ if (t.value && t.value !== b.returnedAt) upd('books', id, { returnedAt: t.value }).then(function(){ renderSheet(true); }); }
  if (f === 'readAt'){ if (t.value && t.value !== b.readAt) upd('books', id, { readAt: t.value }); }
  if (f === 'borrowedAt'){ if (t.value && (t.value !== b.borrowedAt || b.returnedAt)) upd('books', id, extOf(b) ? { borrowedAt: t.value, returnedAt: null } : { borrowedAt: t.value, returnedAt: null, dueAt: null }).then(function(ok){ if (ok) toast('Връщане до ' + fmt(addDays(t.value, loanDaysFor(libOf(b)))) + '.'); renderSheet(true); }); }
});
sheetBody.addEventListener('input', function(e){
  if (e.target.id === 'bText') bulkPreview();
  if (e.target.id === 'sq') $('#srList').innerHTML = searchResults(e.target.value);
  if (e.target.id === 'lbCardNo') fillLetter(false);
  if (e.target.id === 'pq' && S.sheet && S.sheet.kind === 'pick'){ S.sheet.q = e.target.value; $('#pickList').innerHTML = pickCandidates(); }
  if (e.target.id === 'aTitle') e.target.classList.remove('bad');
  if (e.target.id === 'brDate' && e.target.value) $('#brDue').textContent = borrowPreview(e.target.value, $('#brLib') ? $('#brLib').value : libs()[0].id);
  if (e.target.id === 'exDate' && e.target.value && S.sheet){ var exLib = libById(String(S.sheet.id).split('|')[0]); $('#exNote').textContent = 'Нов срок ' + fmt(e.target.value) + '.' + thursdayNote(e.target.value, exLib) + cardNote(e.target.value, exLib); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && S.sheet) closeSheet(); });

view.addEventListener('change', function(e){
  if (e.target.classList && e.target.classList.contains('sortSel')){ S.sort = e.target.value; try { localStorage.setItem('lib.sort', S.sort); } catch (err) {} renderView(); }
});
view.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
  if (act === 'open') openSheet('book', id);
  else if (act === 'toggle') toggleRead(id);
  else if (act === 'edit-list') openSheet('list', id);
  else if (act === 'seg'){ S.seg = t.getAttribute('data-v'); renderView(); }
  else if (act === 'fold'){ S.openFold = S.openFold === id ? null : id; renderView(); }
  else if (act === 'past'){ S.showPast = !S.showPast; renderView(); }
  else if (act === 'zone'){ S.openZones = S.openZones || {}; S.openZones[id] = !S.openZones[id]; renderView(); }
  else if (act === 'stat'){ S.statOpen = S.statOpen === id ? null : id; renderView(); }
  else if (act === 'enqueue-rest'){
    var infosNow = upcomingInfos(), inUp = {}, q = [];
    infosNow.forEach(function(i){ i.items.forEach(function(it){ inUp[it.b] = 1; }); });
    S.books.forEach(function(b){ if (b.status !== 'read' && isLib(b) && !onLoan(b) && !inUp[b.id]) q.push(b); });
    q.sort(function(a, b){ return a.title.localeCompare(b.title, 'bg'); });
    S.openFold = null;
    enqueue(q.map(function(b){ return b.id; })).then(function(){ toast('Подредени във взимания.'); });
  }
  else if (act === 'settings') openSheet('settings');
  else if (act === 'borrow') openSheet('borrow', id);
  else if (act === 'recap'){ openSheet('recap', id); startRecap(id); }
  else if (act === 'extend') openSheet('extend', t.getAttribute('data-key'));
  else if (act === 'return'){ S.confirm = 'ret:' + t.getAttribute('data-key'); renderView(); }
  else if (act === 'return-yes'){
    var rkey = t.getAttribute('data-key'), jobs = [];
    S.books.forEach(function(b){ if (onLoan(b) && loanKey(b) === rkey) jobs.push(upd('books', b.id, { returnedAt: today() })); });
    S.confirm = null;
    Promise.all(jobs).then(function(r){ if (r.every(Boolean)) toast('Отбелязани като върнати.'); });
  }
});
document.querySelector('.tabs').addEventListener('click', function(e){
  var t = e.target.closest('[data-tab]'); if (!t) return;
  S.tab = t.getAttribute('data-tab'); renderView(); window.scrollTo(0, 0);
  try { localStorage.setItem('lib.tab', S.tab); } catch (err) {}
});
$('#tabAdd').addEventListener('click', function(){ openSheet('add'); });
$('#btnSettings').addEventListener('click', function(){ openSheet('settings'); });
$('#btnSearch').addEventListener('click', function(){ openSheet('search'); });
$('#idleGo').addEventListener('click', function(){ S.idlePreview = false; S.idleHidden = true; S.tab = 'lists'; renderAll(); window.scrollTo(0, 0); });
$('#idleClose').addEventListener('click', function(){ S.idlePreview = false; S.idleHidden = true; renderHeader(); });
$('#dueBanner').addEventListener('click', function(){ S.tab = 'lists'; renderView(); window.scrollTo(0, 0); });

/* ---------- start ---------- */
function showNotice(msg){ var n = $('#notice'); n.textContent = msg; n.hidden = false; }
function subFail(e){
  if (window.console) console.error(e);
  S.canWrite = false; showNotice('Връзката с библиотеката прекъсна. Презареди страницата.'); renderAll();
}
function getTheme(){ var t = ''; try { t = localStorage.getItem('lib.theme') || ''; } catch (err) {} return t === 'light' || t === 'dark' ? t : ''; }
function applyTheme(t){
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else if (!window.__hostTheme) document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', window.__hostTheme);
}
function setTheme(t){ try { if (t) localStorage.setItem('lib.theme', t); else localStorage.removeItem('lib.theme'); } catch (err) {} applyTheme(t); }
window.__hostTheme = document.documentElement.getAttribute('data-theme') || '';
applyTheme(getTheme());
var APP_VERSION = 9;
function start(){
  try { var t = localStorage.getItem('lib.tab'); if (t === 'lists' || t === 'read') S.tab = t; var so = localStorage.getItem('lib.sort'); if (so && SORTS.some(function(o){ return o[0] === so; })) S.sort = so; } catch (err) {}
  renderAll();
  var c = window.claude;
  if (!c || typeof c.use !== 'function'){
    S.noDb = true; showNotice('Отвори библиотеката през Claude с твоя профил, за да се виждат книгите и да се пазят отметките.'); renderAll(); return;
  }
  c.use('downloads').then(function(d){ S.downloads = d || null; }, function(){});
  Promise.all([c.use('db'), c.use('assets'), c.use('user')]).then(function(r){
    var db = r[0], user = r[2];
    S.assets = r[1] || null;
    if (!db){
      S.noDb = true; showNotice('Отвори библиотеката през Claude с твоя профил, за да се виждат книгите и да се пазят отметките.'); renderAll(); return;
    }
    S.db = db;
    var can = user && user.can ? user.can('data.write') : Promise.resolve(null);
    can.then(function(v){ S.canWrite = v !== false; renderAll(); });
    db.collection('books').onSnapshot(function(snap){
      var m = new Map();
      snap.docs.forEach(function(d){ var x = d.data() || {}; m.set(d.id, Object.assign({ title: '' }, x, { id: d.id })); });
      S.books = m; S.loaded.books = true; renderAll();
    }, subFail);
    db.collection('lists').onSnapshot(function(snap){
      S.lists = snap.docs.map(function(d){ return Object.assign({ name: '', items: [] }, d.data() || {}, { id: d.id }); })
        .sort(function(a, b){ return zoneNum(a.age) - zoneNum(b.age) || (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name, 'bg'); });
      S.loaded.lists = true; renderAll();
    }, subFail);
    db.doc('meta/settings').onSnapshot(function(d){ S.settings = d.exists ? (d.data() || {}) : {}; renderAll(); }, subFail);
  });
}
start();
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
</script>
